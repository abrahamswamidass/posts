<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="white">
  <!-- Water surface ripple hint -->
  <path d="M 0,42 Q 50,35 100,42 Q 150,49 200,42 Q 250,35 300,42" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none"/>
  <path d="M 0,50 Q 50,43 100,50 Q 150,57 200,50 Q 250,43 300,50" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>

  <!-- Stromatolite 1 (tallest, center-left) -->
  <path d="M 80,190 L 74,150 Q 72,120 78,100 Q 84,82 90,100 Q 96,120 94,150 L 88,190 Z"/>
  <ellipse cx="84" cy="98" rx="18" ry="12"/>
  <!-- Layering (horizontal growth bands) -->
  <line x1="72" y1="160" x2="96" y2="160" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="72" y1="148" x2="96" y2="148" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="73" y1="136" x2="95" y2="136" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="74" y1="124" x2="94" y2="124" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="75" y1="113" x2="93" y2="113" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>

  <!-- Stromatolite 2 (medium, center) -->
  <path d="M 140,190 L 135,158 Q 133,135 138,118 Q 143,104 148,118 Q 153,135 151,158 L 146,190 Z"/>
  <ellipse cx="143" cy="116" rx="16" ry="10"/>
  <line x1="134" y1="168" x2="152" y2="168" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="134" y1="156" x2="152" y2="156" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="135" y1="144" x2="151" y2="144" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="135" y1="133" x2="151" y2="133" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>

  <!-- Stromatolite 3 (short, right) -->
  <path d="M 200,190 L 196,168 Q 194,150 198,138 Q 202,128 206,138 Q 210,150 208,168 L 204,190 Z"/>
  <ellipse cx="202" cy="137" rx="13" ry="8"/>
  <line x1="194" y1="176" x2="210" y2="176" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="194" y1="163" x2="210" y2="163" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="195" y1="152" x2="209" y2="152" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>

  <!-- Stromatolite 4 (small, far left) -->
  <path d="M 30,190 L 27,172 Q 26,160 29,152 Q 32,144 35,152 Q 38,160 37,172 L 34,190 Z"/>
  <ellipse cx="32" cy="151" rx="10" ry="7"/>
  <line x1="27" y1="180" x2="37" y2="180" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="27" y1="169" x2="37" y2="169" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>

  <!-- Stromatolite 5 (cluster, far right) -->
  <path d="M 252,190 L 248,162 Q 246,142 251,128 Q 256,116 260,128 Q 264,142 262,162 L 258,190 Z"/>
  <ellipse cx="255" cy="127" rx="15" ry="9"/>
  <line x1="247" y1="172" x2="263" y2="172" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="247" y1="160" x2="263" y2="160" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="247" y1="149" x2="263" y2="149" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <line x1="248" y1="139" x2="262" y2="139" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>

  <!-- Seafloor / substrate -->
  <rect x="0" y="188" width="300" height="32" rx="4" fill="white" opacity="0.85"/>
  <!-- Substrate texture -->
  <path d="M 10,196 Q 30,192 50,196 Q 70,200 90,196 Q 110,192 130,196" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none"/>
  <path d="M 160,196 Q 180,192 200,196 Q 220,200 240,196 Q 260,192 280,196" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none"/>

  <!-- Microbial film glint dots (cyanobacteria suggestion) -->
  <circle cx="84" cy="94" r="3" fill="rgba(0,0,0,0.2)"/>
  <circle cx="90" cy="88" r="2" fill="rgba(0,0,0,0.2)"/>
  <circle cx="78" cy="90" r="2" fill="rgba(0,0,0,0.2)"/>
  <circle cx="143" cy="112" r="2.5" fill="rgba(0,0,0,0.2)"/>
  <circle cx="148" cy="106" r="2" fill="rgba(0,0,0,0.2)"/>
  <circle cx="255" cy="123" r="2" fill="rgba(0,0,0,0.2)"/>
</svg>
