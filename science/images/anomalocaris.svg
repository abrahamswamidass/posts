  <line x1="26" y1="122" x2="20" y2="134" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="35" y1="117" x2="30" y2="130" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
