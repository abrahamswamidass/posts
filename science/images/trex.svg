  <ellipse cx="130" cy="135" rx="52" ry="42"/>
  <!-- Neck -->
  <path d="M 95,100 Q 85,85 80,70 Q 85,60 95,65 Q 105,72 108,88 Q 112,104 108,118"/>
  <!-- Large head -->
  <path d="M 25,52 Q 10,62 8,80 Q 10,96 25,104 Q 42,112 65,110 Q 85,108 95,98 Q 104,88 100,72 Q 95,58 80,50 Q 62,42 42,44 Q 32,46 25,52 Z"/>
  <!-- Upper jaw (snout) -->
