  <path d="M 218,160 Q 248,162 272,158 Q 290,155 288,167 Q 272,172 252,170 Q 236,168 220,162"/>
  <!-- Hip and body rear -->
  <ellipse cx="185" cy="148" rx="55" ry="50"/>
