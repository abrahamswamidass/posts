  <!-- Eye (large, forward facing) -->
  <circle cx="52" cy="62" r="14" fill="rgba(0,0,0,0.4)"/>
  <circle cx="52" cy="62" r="7" fill="rgba(0,0,0,0.6)"/>
  <!-- Brow ridge -->
  <path d="M 38,52 Q 52,46 68,52" stroke="rgba(0,0,0,0.2)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Tiny arms -->
  <path d="M 100,120 Q 88,118 80,128 Q 78,136 85,138 Q 92,136 96,128"/>
  <path d="M 85,138 L 82,148 M 90,140 L 90,150" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Powerful thigh -->
  <path d="M 175,192 Q 165,220 158,248 Q 152,260 142,258 Q 148,244 152,222 Q 156,202 162,192"/>
  <!-- Lower leg (shin) -->
  <path d="M 155,248 Q 148,262 145,278 Q 155,280 165,278 Q 162,264 160,250"/>
  <!-- Foot (3 clawed toes) -->
  <path d="M 140,278 Q 128,285 122,292 L 126,296 Q 134,290 144,284"/>
  <path d="M 152,278 Q 148,288 148,296 Q 156,298 158,290 Q 156,284 155,278"/>
  <path d="M 162,280 Q 168,290 174,296 L 178,292 Q 172,285 165,278"/>
