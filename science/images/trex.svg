  <!-- Lower jaw -->
  <path d="M 8,84 Q 0,95 4,108 Q 12,118 30,120 Q 50,122 70,118 Q 88,114 96,105 L 90,98 Q 75,108 55,112 Q 36,115 20,112 Q 10,108 8,100 Z" fill="rgba(0,0,0,0.2)"/>
